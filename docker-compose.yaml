services:
  grafana:
    build:
      context: .
      args:
        GRAFANA_VERSION: ${GRAFANA_VERSION:-12.3.3}
        MCP_GRAFANA_VERSION: ${MCP_GRAFANA_VERSION:-v1.2.0}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: acme-aiassistant-app
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-180s}
      MCP_GRAFANA_PATH: /usr/local/bin/mcp-grafana
      GRAFANA_URL: http://127.0.0.1:3000
      GRAFANA_USERNAME: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      POSTGRES_USER: ${POSTGRES_USER:-grafana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grafana-demo}
      POSTGRES_DB: ${POSTGRES_DB:-observability}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grafana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grafana-demo}
      POSTGRES_DB: ${POSTGRES_DB:-observability}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.11.7}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.11.7}
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "${LLM_MODEL:-qwen2.5:3b}"
        status=$$?
        kill "$$server_pid"
        wait "$$server_pid" || true
        exit "$$status"
    volumes:
      - ollama-data:/root/.ollama
    networks: [bootstrap]
    restart: "no"

networks:
  internal:
    internal: true
  edge: {}
  bootstrap: {}

volumes:
  grafana-data:
  ollama-data:
  postgres-data:
